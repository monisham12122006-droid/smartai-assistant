<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Powered Voice Mock Interview</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; padding-top: 50px; }
        .card { box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-radius: 10px; }
        pre { white-space: pre-wrap; font-family: inherit; font-size: 1rem; }
    </style>
</head>
<body>

<div class="container col-md-6">
    <div class="card p-4 text-center">
        <h3 class="mb-3">🎙️ AI-Powered Voice Mock Interview</h3>
        <p class="text-muted">Upload your resume PDF to start a voice-based interview simulation.</p>
        
        <div id="upload-section">
            <input type="file" id="resumeFile" class="form-control mb-3">
            <button class="btn btn-primary w-100" onclick="uploadResume()">Upload & Start</button>
        </div>

        <div id="interview-section" class="text-start mt-4" style="display: none;">
            <h5 id="question-number" class="text-primary">Question 1 of 3:</h5>
            <p id="question-text" class="fw-bold fs-5"></p>
            
            <button class="btn btn-secondary btn-sm mb-3" onclick="speakQuestion()">🔊 Speak Question Again</button>
            
            <div class="mb-3">
                <label class="form-label fw-bold">Your Answer:</label>
                <textarea id="user-answer" class="form-control" rows="4" placeholder="[Click Start Mic and Speak Your Answer...]"></textarea>
            </div>

            <div class="d-flex gap-2 mb-3">
                <button id="mic-btn" class="btn btn-success flex-fill" onclick="toggleMic()">🎙️ Start Mic</button>
                <button class="btn btn-warning flex-fill" style="background-color: #f0ad4e; color: white;" onclick="submitAnswer()">Submit Answer for Review</button>
            </div>
        </div>

        <div id="result-section" class="text-start mt-4 p-3 bg-light border rounded" style="display: none;">
            <h5 class="text-secondary fw-bold">=== RESULT FOR QUESTION ===</h5>
            <p class="mb-1"><strong>STATUS:</strong> <span id="res-status" class="text-dark"></span></p>
            <p class="mb-2"><strong>SCORE:</strong> <span id="res-score" class="text-dark"></span></p>
            <p class="mb-1"><strong>EVALUATION & FEEDBACK:</strong></p>
            <div class="p-2 border rounded bg-white">
                <pre id="res-explanation" class="mb-0"></pre>
            </div>
            <button id="next-btn" class="btn btn-info w-100 mt-3 text-white" onclick="nextQuestion()">Finish Interview 🏁</button>
        </div>
    </div>
</div>

<script>
    let questions = [];
    let currentIndex = 0;
    let recognition;
    let isRecording = false;

    if ('webkitSpeechRecognition' in window) {
        recognition = new webkitSpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = false;
        recognition.lang = 'en-US';

        recognition.onresult = function(event) {
            let resultText = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    resultText += event.results[i][0].transcript;
                }
            }
            document.getElementById('user-answer').value += resultText + ' ';
        };
    }

    function toggleMic() {
        const micBtn = document.getElementById('mic-btn');
        if (!isRecording) {
            recognition.start();
            isRecording = true;
            micBtn.innerText = "🛑 Stop Mic & Hold";
            micBtn.className = "btn btn-danger flex-fill";
        } else {
            recognition.stop();
            isRecording = false;
            micBtn.innerText = "🎙️ Start Mic";
            micBtn.className = "btn btn-success flex-fill";
        }
    }

    function speakQuestion() {
        let text = document.getElementById('question-text').innerText;
        let utterance = new SpeechSynthesisUtterance(text);
        window.speechSynthesis.speak(utterance);
    }

    async function uploadResume() {
        const fileInput = document.getElementById('resumeFile');
        if (fileInput.files.length === 0) return alert("Please choose a file!");

        const formData = new FormData();
        formData.append("resume", fileInput.files[0]);

        let response = await fetch('/upload', { method: 'POST', body: formData });
        let data = await response.json();

        if (data.questions) {
            questions = data.questions;
            currentIndex = 0;
            showQuestion();
            document.getElementById('upload-section').style.display = 'none';
            document.getElementById('interview-section').style.display = 'block';
        }
    }

    function showQuestion() {
        document.getElementById('question-number').innerText = `Question ${currentIndex + 1} of ${questions.length}:`;
        document.getElementById('question-text').innerText = questions[currentIndex];
        document.getElementById('user-answer').value = '';
        document.getElementById('result-section').style.display = 'none';
        
        if(currentIndex === questions.length - 1) {
            document.getElementById('next-btn').innerText = "Finish Interview 🎉";
        } else {
            document.getElementById('next-btn').innerText = "Next Question ➡️";
        }
        speakQuestion();
    }

    async function submitAnswer() {
        const userAnswer = document.getElementById('user-answer').value;
        const currentQuestion = questions[currentIndex];

        // UI-ல் லோடிங் காட்டுவதற்கு
        document.getElementById('res-status').innerText = "Evaluating...";
        document.getElementById('res-score').innerText = "Calculating...";
        document.getElementById('res-explanation').innerText = "AI is reviewing your voice answer...";
        document.getElementById('result-section').style.display = 'block';

        let response = await fetch('/evaluate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question: currentQuestion, user_answer: userAnswer })
        });
        
        let data = await response.json();
        
        // பேக்கண்டில் இருந்து வரும் டேட்டாவை அப்படியே மேப் செய்கிறோம்
        document.getElementById('res-status').innerText = data.status;
        document.getElementById('res-score').innerText = data.score;
        document.getElementById('res-explanation').innerText = data.explanation;
    }

    function nextQuestion() {
        if (currentIndex < questions.length - 1) {
            currentIndex++;
            showQuestion();
        } else {
            alert("Interview Completed Successfully! Great Job.");
            location.reload();
        }
    }
</script>

</body>
</html>
